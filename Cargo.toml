[package]
name = "glam-traits"
version = "0.3.2"
edition = "2021"
authors = ["Zane Jacobs"]
description = "Traits for the vectors in glam."
license = "0BSD"
repository = "https://github.com/Ababwa/glam-traits"

[dependencies.glam]
version = "0.34.3"
default-features = false
features = ["all-types"]

[features]
std = ["glam/std"]
libm = ["glam/libm"]
default = ["std"]
